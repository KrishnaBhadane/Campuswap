<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Campuswap - Login | Verified Campus Marketplace</title>
  <meta name="description" content="Login to E-Campuswap. Exchange, learn, and save with verified students on campus.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <!-- Modular Stylesheets -->
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="icon" type="image/png" href="../assets/logo-icon.png">
</head>
<body>

  <!-- Ambient College Background Layer with Sunlight Glow -->
  <div class="ambient-background">
    <div class="bg-image-layer"></div>
    <div class="bg-sunlight-glow"></div>
    <div class="bg-subtle-overlay"></div>
  </div>

  <!-- Main Viewport Container -->
  <main class="auth-wrapper">
    <div class="auth-container">
      
      <!-- ================= LOGIN CARD (100% MATCHING UI MOCKUP) ================= -->
      <section class="auth-card" aria-label="Login to E-Campuswap">
        
        <!-- Brand Header -->
        <header class="card-header">
          <div class="logo-icon-wrapper">
            <img src="../assets/logo-icon.png" alt="E-Campuswap Cap Logo" class="brand-cap-icon" width="60" height="52">
          </div>
          <h1 class="brand-title">
            <span class="text-dark">E-Campus</span><span class="text-orange">wap</span>
          </h1>
          <p class="brand-tagline">Exchange. Learn. Save.</p>
        </header>

        <!-- Welcome Text -->
        <div class="form-title-group">
          <h2 class="welcome-heading">Welcome Back!</h2>
          <p class="welcome-subtext">Login to continue to E-Campuswap</p>
        </div>

        <!-- Login Form -->
        <form class="auth-form" action="home.html" method="GET">
          
          <!-- Email / Username Input -->
          <div class="form-group">
            <label for="login-identifier" class="input-label">Email / Username</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </span>
              <input 
                type="text" 
                id="login-identifier" 
                name="identifier" 
                class="form-input" 
                placeholder="Enter your email or username" 
                required 
                autocomplete="username"
              >
            </div>
          </div>

          <!-- Password Input -->
          <div class="form-group">
            <label for="login-password" class="input-label">Password</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input 
                type="password" 
                id="login-password" 
                name="password" 
                class="form-input password-input" 
                placeholder="Enter your password" 
                required 
                autocomplete="current-password"
              >
              <span class="input-action-icon" aria-hidden="true">
                <!-- Static Password Eye Icon -->
                <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </span>
            </div>
            <div class="forgot-row">
              <a href="#" class="forgot-link">Forgot password?</a>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary" id="login-btn">
            <span>Login</span>
            <svg class="btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </form>

        <!-- Divider -->
        <div class="divider">
          <span class="divider-text">or continue with</span>
        </div>

        <!-- Social Logins -->
        <div class="social-login-grid">
          <a href="#" class="btn-social">
            <svg class="social-icon" width="18" height="18" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
              <path fill="#FBBC05" d="M5.28 14.27A7.16 7.16 0 0 1 4.9 12c0-.79.14-1.57.38-2.27V6.58H1.25A11.96 11.96 0 0 0 0 12c0 1.92.45 3.74 1.25 5.42l4.03-3.15z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
            </svg>
            <span>Google</span>
          </a>
          
          <a href="#" class="btn-social">
            <svg class="social-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
            </svg>
            <span>GitHub</span>
          </a>
        </div>

        <!-- Switch to Create New Account Page Link -->
        <div class="auth-switch-box">
          <p class="auth-switch-text">
            Don't have an account? 
            <a href="register.html" class="switch-link">Create new account</a>
          </p>
        </div>

        <!-- Campus Trust Badge Footer -->
        <footer class="card-footer">
          <div class="trust-badge">
            <svg class="trust-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              <polyline points="9 12 11 14 15 10"></polyline>
            </svg>
            <span>Only students from verified campuses can join.</span>
          </div>
        </footer>

      </section>

    </div>
  </main>

</body>
</html>
