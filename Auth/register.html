<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Campuswap</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>

  <!-- Main Register Card -->
  <div class="auth-card">
    <img src="../assets/logo.png" alt="Campuswap Logo" class="logo">
    <h2>Create Account</h2>

    <form>
      <!-- 1. Full Name Box -->
      <div class="box">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter full name" required>
      </div>

      <!-- 2. College Name Box -->
      <div class="box">
        <label for="college">College Name</label>
        <select name="college" id="college">
          <option selected>R. C. Patel Institute of Technology, Shirpur</option>
        </select>
      </div>

      <!-- 3. Gmail Box -->
      <div class="box">
        <label for="email">Gmail</label>
        <input type="email" id="email" placeholder="Enter Gmail" required>
      </div>

      <!-- 4. Password Box -->
      <div class="box">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create password" required>
      </div>

      <!-- 5. Confirm Password Box -->
      <div class="box">
        <label for="cpassword">Confirm Password</label>
        <input type="password" id="cpassword" placeholder="Confirm password" required>
      </div>

      <!-- 6. College ID Card Upload Box -->
      <div class="box">
        <label for="id-card">College ID Card (For Authentication)</label>
        <input type="file" id="id-card" accept="image/*" required>
      </div>

      <!-- 7. Submit Button -->
      <button type="submit" class="btn">Sign Up</button>
    </form>

    <!-- Switch to Login -->
    <p class="switch">Already have an account? <a href="login.html">Login</a></p>
    <a href="../index.html" class="home-link">← Back to Home</a>
  </div>

</body>
</html>
