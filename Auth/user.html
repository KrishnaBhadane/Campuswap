<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Campuswap</title>
  <link rel="stylesheet" href="user.css">
</head>
<body>

  <!-- Main Unified Auth Card -->
  <div class="auth-card">
    <a href="../index.html">
      <img src="../assets/logo.png" alt="Campuswap Logo" class="logo">
    </a>

    <!-- Status Alert Banner -->
    <div id="auth-alert" class="auth-alert" role="alert"></div>

    <!-- Switcher Tabs -->
    <div class="auth-tabs" role="tablist" aria-label="User Authentication Tabs">
      <button type="button" class="auth-tab-btn active" id="tab-login" role="tab" aria-selected="true" aria-controls="login-section" data-tab="login">Login</button>
      <button type="button" class="auth-tab-btn" id="tab-register" role="tab" aria-selected="false" aria-controls="register-section" data-tab="register">Create Account</button>
    </div>

    <!-- ================= LOGIN SECTION ================= -->
    <section id="login-section" class="auth-section active" role="tabpanel" aria-labelledby="tab-login">
      <h2>Login</h2>

      <form id="login-form">
        <!-- Email -->
        <div class="box">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" placeholder="Enter your email" required autocomplete="email">
        </div>

        <!-- Password -->
        <div class="box">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn" id="login-submit-btn">Login</button>
      </form>

      <!-- Switch to Register -->
      <p class="switch">Don't have an account? <a href="#register" class="toggle-link" data-target="register">Create Account</a></p>
    </section>

    <!-- ================= REGISTER SECTION ================= -->
    <section id="register-section" class="auth-section" role="tabpanel" aria-labelledby="tab-register">
      <h2>Create Account</h2>

      <form id="register-form">
        <!-- 1. Full Name -->
        <div class="box">
          <label for="register-name">Full Name</label>
          <input type="text" id="register-name" name="name" placeholder="e.g. Rahul Sharma" required autocomplete="name">
        </div>

        <!-- 2. Email -->
        <div class="box">
          <label for="register-email">Email</label>
          <input type="email" id="register-email" name="email" placeholder="e.g. rahul@example.com" required autocomplete="email">
        </div>

        <!-- 3. Password -->
        <div class="box">
          <label for="register-password">Password (min. 8 characters)</label>
          <input type="password" id="register-password" name="password" placeholder="Create password" minlength="8" required autocomplete="new-password">
        </div>

        <!-- 4. Confirm Password -->
        <div class="box">
          <label for="register-cpassword">Confirm Password</label>
          <input type="password" id="register-cpassword" name="cpassword" placeholder="Confirm password" minlength="8" required autocomplete="new-password">
        </div>

        <!-- 5. Phone -->
        <div class="box">
          <label for="register-phone">Phone Number (10 digits)</label>
          <input type="tel" id="register-phone" name="phone" placeholder="e.g. 9876543210" pattern="[0-9]{10}" required autocomplete="tel">
        </div>

        <!-- 6. College Name -->
        <div class="box">
          <label for="register-college">College / Campus</label>
          <input type="text" id="register-college" name="college" placeholder="e.g. RCPIT or XYZ College" required>
        </div>

        <!-- 7. Department -->
        <div class="box">
          <label for="register-dept">Department / Branch</label>
          <input type="text" id="register-dept" name="department" placeholder="e.g. Computer Engineering">
        </div>

        <!-- 8. Year -->
        <div class="box">
          <label for="register-year">Current Year</label>
          <input type="number" id="register-year" name="year" min="1" max="6" placeholder="e.g. 2">
        </div>

        <!-- 9. College ID Card Upload (Optional during registration) -->
        <div class="box">
          <label for="register-id-card">College ID Card (For Campus Verification)</label>
          <input type="file" id="register-id-card" name="idCard" accept="image/jpeg,image/png,image/webp">
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn" id="register-submit-btn">Create Account</button>
      </form>

      <!-- Switch to Login -->
      <p class="switch">Already have an account? <a href="#login" class="toggle-link" data-target="login">Login</a></p>
    </section>

    <!-- Back to Home Link -->
    <a href="../index.html" class="home-link">&larr; Back to Marketplace</a>
  </div>

  <script>
    (function () {
      const alertBox = document.getElementById('auth-alert');
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const sectionLogin = document.getElementById('login-section');
      const sectionRegister = document.getElementById('register-section');
      const loginForm = document.getElementById('login-form');
      const registerForm = document.getElementById('register-form');
      const loginSubmitBtn = document.getElementById('login-submit-btn');
      const registerSubmitBtn = document.getElementById('register-submit-btn');

      function showAlert(message, type = 'error') {
        alertBox.className = 'auth-alert ' + type;
        alertBox.textContent = message;
        alertBox.style.display = 'block';
      }

      function clearAlert() {
        alertBox.className = 'auth-alert';
        alertBox.textContent = '';
        alertBox.style.display = 'none';
      }

      // Check if already authenticated; if so, redirect directly to marketplace
      fetch('/api/auth/me')
        .then(res => res.json())
        .then(data => {
          if (data && data.success && data.user) {
            const redirectParam = new URLSearchParams(window.location.search).get('redirect');
            window.location.replace(redirectParam ? '../' + redirectParam : '../index.html');
          }
        })
        .catch(() => {});

      function switchTab(mode, updateHash = true) {
        clearAlert();
        const isRegister = mode === 'register';

        tabLogin.classList.toggle('active', !isRegister);
        tabLogin.setAttribute('aria-selected', !isRegister);
        tabRegister.classList.toggle('active', isRegister);
        tabRegister.setAttribute('aria-selected', isRegister);

        sectionLogin.classList.toggle('active', !isRegister);
        sectionRegister.classList.toggle('active', isRegister);

        document.title = isRegister ? 'Create Account - Campuswap' : 'Login - Campuswap';

        if (updateHash) {
          const targetHash = isRegister ? '#register' : '#login';
          if (window.location.hash !== targetHash) {
            history.replaceState(null, '', targetHash);
          }
        }
      }

      function syncWithHash() {
        const hash = window.location.hash.toLowerCase();
        if (hash === '#register') {
          switchTab('register', false);
        } else {
          switchTab('login', false);
        }
      }

      tabLogin.addEventListener('click', () => switchTab('login'));
      tabRegister.addEventListener('click', () => switchTab('register'));

      document.querySelectorAll('.toggle-link').forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          switchTab(link.getAttribute('data-target'));
        });
      });

      window.addEventListener('hashchange', syncWithHash);
      syncWithHash();

      // Handle Login
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearAlert();
        loginSubmitBtn.disabled = true;
        loginSubmitBtn.textContent = 'Logging in...';

        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const data = await res.json();
          if (res.ok && data.success) {
            showAlert('Login successful! Redirecting...', 'success');
            const redirectParam = new URLSearchParams(window.location.search).get('redirect');
            setTimeout(() => {
              window.location.replace(redirectParam ? '../' + redirectParam : '../index.html');
            }, 600);
          } else {
            showAlert(data.message || 'Invalid email or password');
          }
        } catch {
          showAlert('Network error. Please try again.');
        } finally {
          loginSubmitBtn.disabled = false;
          loginSubmitBtn.textContent = 'Login';
        }
      });

      // Handle Registration
      registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearAlert();

        const name = document.getElementById('register-name').value.trim();
        const email = document.getElementById('register-email').value.trim();
        const password = document.getElementById('register-password').value;
        const cpassword = document.getElementById('register-cpassword').value;
        const phone = document.getElementById('register-phone').value.trim();
        const college = document.getElementById('register-college').value.trim();
        const department = document.getElementById('register-dept').value.trim();
        const yearVal = document.getElementById('register-year').value;
        const year = yearVal ? Number(yearVal) : undefined;
        const idCardFile = document.getElementById('register-id-card').files[0];

        if (password !== cpassword) {
          showAlert('Passwords do not match');
          return;
        }

        registerSubmitBtn.disabled = true;
        registerSubmitBtn.textContent = 'Creating account...';

        try {
          const regRes = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password, phone, college, department, year })
          });
          const regData = await regRes.json();

          if (!regRes.ok || !regData.success) {
            showAlert(regData.message || 'Registration failed');
            registerSubmitBtn.disabled = false;
            registerSubmitBtn.textContent = 'Create Account';
            return;
          }

          // Auto-login to establish session
          const loginRes = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const loginData = await loginRes.json();

          if (loginRes.ok && loginData.success) {
            // If ID Card provided, upload it
            if (idCardFile) {
              registerSubmitBtn.textContent = 'Uploading verification ID...';
              const formData = new FormData();
              formData.append('collegeId', idCardFile);
              try {
                await fetch('/api/users/me/verification', {
                  method: 'PUT',
                  body: formData
                });
              } catch {}
            }

            showAlert('Account created! Verification status: Pending review. Redirecting to your campus...', 'success');
            setTimeout(() => {
              window.location.replace('../index.html');
            }, 1200);
          } else {
            showAlert('Account created. Please log in.', 'success');
            switchTab('login');
          }
        } catch {
          showAlert('Network error during registration.');
        } finally {
          registerSubmitBtn.disabled = false;
          registerSubmitBtn.textContent = 'Create Account';
        }
      });
    })();
  </script>
</body>
</html>
