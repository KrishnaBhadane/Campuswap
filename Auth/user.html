<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Campuswap</title>
  <link rel="stylesheet" href="user.css">
</head>
<body>

  <!-- Main Unified Auth Card -->
  <div class="auth-card">
    <a href="../index.html">
      <img src="../assets/logo.png" alt="Campuswap Logo" class="logo">
    </a>

    <!-- Switcher Tabs -->
    <div class="auth-tabs" role="tablist" aria-label="User Authentication Tabs">
      <button type="button" class="auth-tab-btn active" id="tab-login" role="tab" aria-selected="true" aria-controls="login-section" data-tab="login">Login</button>
      <button type="button" class="auth-tab-btn" id="tab-register" role="tab" aria-selected="false" aria-controls="register-section" data-tab="register">Register</button>
    </div>

    <!-- ================= LOGIN SECTION ================= -->
    <section id="login-section" class="auth-section active" role="tabpanel" aria-labelledby="tab-login">
      <h2>Login</h2>

      <form id="login-form">
        <!-- 1. Email Rectangle Box -->
        <div class="box">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" placeholder="Enter your email" required autocomplete="email">
        </div>

        <!-- 2. Password Rectangle Box -->
        <div class="box">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <!-- 3. Forget Password & Remember Me Rectangle Box -->
        <div class="box forgot-box">
          <label><input type="checkbox" name="remember"> Remember me</label>
          <a href="#">Forgot Password?</a>
        </div>

        <!-- 4. Submit Button -->
        <button type="submit" class="btn" id="login-submit-btn">Login</button>
      </form>

      <!-- Switch to Register -->
      <p class="switch">Don't have an account? <a href="#register" class="toggle-link" data-target="register">Sign Up</a></p>
    </section>

    <!-- ================= REGISTER SECTION ================= -->
    <section id="register-section" class="auth-section" role="tabpanel" aria-labelledby="tab-register">
      <h2>Create Account</h2>

      <form id="register-form">
        <!-- 1. Full Name Box -->
        <div class="box">
          <label for="register-name">Full Name</label>
          <input type="text" id="register-name" name="name" placeholder="Enter full name" required autocomplete="name">
        </div>

        <!-- 2. College Name Box -->
        <div class="box">
          <label for="register-college">College Name</label>
          <select name="college" id="register-college">
            <option selected>R. C. Patel Institute of Technology, Shirpur</option>
          </select>
        </div>

        <!-- 3. Gmail Box -->
        <div class="box">
          <label for="register-email">Gmail</label>
          <input type="email" id="register-email" name="email" placeholder="Enter Gmail" required autocomplete="email">
        </div>

        <!-- 4. Password Box -->
        <div class="box">
          <label for="register-password">Password</label>
          <input type="password" id="register-password" name="password" placeholder="Create password" required autocomplete="new-password">
        </div>

        <!-- 5. Confirm Password Box -->
        <div class="box">
          <label for="register-cpassword">Confirm Password</label>
          <input type="password" id="register-cpassword" name="cpassword" placeholder="Confirm password" required autocomplete="new-password">
        </div>

        <!-- 6. College ID Card Upload Box -->
        <div class="box">
          <label for="register-id-card">College ID Card (For Authentication)</label>
          <input type="file" id="register-id-card" name="id-card" accept="image/*" required>
        </div>

        <!-- 7. Submit Button -->
        <button type="submit" class="btn" id="register-submit-btn">Sign Up</button>
      </form>

      <!-- Switch to Login -->
      <p class="switch">Already have an account? <a href="#login" class="toggle-link" data-target="login">Login</a></p>
    </section>

    <!-- Back to Home Link -->
    <a href="../index.html" class="home-link">← Back to Home</a>
  </div>

  <script>
    (function () {
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const sectionLogin = document.getElementById('login-section');
      const sectionRegister = document.getElementById('register-section');

      function switchTab(mode, updateHash = true) {
        const isRegister = mode === 'register';

        // Toggle button states
        tabLogin.classList.toggle('active', !isRegister);
        tabLogin.setAttribute('aria-selected', !isRegister);
        tabRegister.classList.toggle('active', isRegister);
        tabRegister.setAttribute('aria-selected', isRegister);

        // Toggle section visibility
        sectionLogin.classList.toggle('active', !isRegister);
        sectionRegister.classList.toggle('active', isRegister);

        // Update Page Title
        document.title = isRegister ? 'Register - Campuswap' : 'Login - Campuswap';

        // Update URL hash without causing a page jump
        if (updateHash) {
          const targetHash = isRegister ? '#register' : '#login';
          if (window.location.hash !== targetHash) {
            history.replaceState(null, '', targetHash);
          }
        }
      }

      // Check initial hash on load
      function syncWithHash() {
        const hash = window.location.hash.toLowerCase();
        if (hash === '#register') {
          switchTab('register', false);
        } else {
          switchTab('login', false);
        }
      }

      // Tab clicks
      tabLogin.addEventListener('click', () => switchTab('login'));
      tabRegister.addEventListener('click', () => switchTab('register'));

      // Link clicks (Sign Up / Login text links)
      document.querySelectorAll('.toggle-link').forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          const target = link.getAttribute('data-target');
          switchTab(target);
        });
      });

      // Handle browser back/forward or hash change
      window.addEventListener('hashchange', syncWithHash);

      // Initialize on load
      syncWithHash();
    })();
  </script>
</body>
</html>
