<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Campuswap</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>

  <!-- Main Login Card -->
  <div class="auth-card">
    <img src="../assets/logo.png" alt="Campuswap Logo" class="logo">
    <h2>Login</h2>

    <form>
      <!-- 1. Email Rectangle Box -->
      <div class="box">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>

      <!-- 2. Password Rectangle Box -->
      <div class="box">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>

      <!-- 3. Forget Password & Remember Me Rectangle Box -->
      <div class="box forgot-box">
        <label><input type="checkbox"> Remember me</label>
        <a href="#">Forgot Password?</a>
      </div>

      <!-- 4. Submit Button -->
      <button type="submit" class="btn">Login</button>
    </form>

    <!-- Switch to Sign Up -->
    <p class="switch">Don't have an account? <a href="register.html">Sign Up</a></p>
    <a href="../index.html" class="home-link">← Back to Home</a>
  </div>

</body>
</html>
